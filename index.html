<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5f0"><link rel="manifest" href="manifest.webmanifest">
<title>BBC Radio Dayboard</title>
<style>
:root{--paper:#f7f5f0;--surface:#fff;--ink:#1e2530;--muted:#6f7884;--line:#dde2e8;--soft:#f0f2f5;--live:#147a4b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.page{max-width:1500px;margin:auto;padding:16px}.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}h1{font-size:30px;margin:6px 0}.subtitle{font-size:13px;color:var(--muted)}
.controls{display:flex;gap:7px;flex-wrap:wrap}button,.datebox{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;min-height:42px}
input{border:0;background:transparent;color:var(--ink);font:inherit}.status{margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:#ffffffc9;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nowstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.card{--accent:#bbb;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}.toprow{display:flex;justify-content:space-between}.name{font-weight:900}.pill{font-size:9px;text-transform:uppercase;font-weight:900;color:var(--live);background:#e8f5ed;border-radius:999px;padding:4px 7px}
.kicker{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:11px}.prog{font-size:14px;font-weight:850;margin-top:3px}.meta{font-size:11px;color:var(--muted);margin-top:3px}
.track{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.song{font-weight:850;font-size:13px}.artist{font-size:11px;color:var(--muted)}
.listen{display:inline-block;margin-top:9px;text-decoration:none;color:inherit;font-size:11px;font-weight:700;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--soft)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:17px;background:#fff}.board{min-width:1020px;display:grid;grid-template-columns:74px repeat(4,minmax(230px,1fr));position:relative}
.head{height:54px;background:#fbfbfc;border-bottom:1px solid var(--line);padding:11px;font-size:12px;font-weight:900}.timecol{height:1440px;background:#fbfbfc}.hour{height:60px;border-top:1px solid var(--line);padding:4px 8px;color:var(--muted);font-size:10px}
.lane{height:1440px;position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,rgba(50,60,70,.065) 60px)}
.event{--accent:#bbb;position:absolute;left:7px;right:7px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:#fff;overflow:hidden}.event:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.event.current{box-shadow:0 0 0 2px #98d5b4 inset;background:#fbfffc}.et{font-size:9px;color:var(--muted);font-weight:800}.en{font-size:10px;font-weight:850;line-height:1.15;margin-top:2px}
.nowline{position:absolute;left:74px;right:0;height:2px;background:#1f8a57;z-index:7}.nowtag{position:absolute;left:5px;transform:translateY(-50%);background:#1f8a57;color:white;font-size:9px;font-weight:900;padding:3px 5px;border-radius:7px;z-index:9}
.diag{margin-top:11px;font-size:10px;color:var(--muted)}@media(max-width:900px){.nowstrip{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}}@media(max-width:520px){.page{padding:10px}.nowstrip{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body>
<div class="page">
<div class="hero"><div><div class="eyebrow">BBC Radio · Accra / GMT</div><h1>Dayboard</h1><div class="subtitle">A lighter 24-hour view of Radio 1, 1Xtra, Radio 2 and 6 Music.</div></div>
<div class="controls"><button id="prev">←</button><label class="datebox"><input id="date" type="date"></label><button id="today">Today</button><button id="next">→</button><button id="refresh">Refresh</button></div></div>
<div class="status"><span id="status">Loading live schedules…</span><span id="updated">—</span></div>
<div id="cards" class="nowstrip"></div>
<div class="wrap"><div id="board" class="board">
<div class="head">GMT</div><div class="head">Radio 1</div><div class="head">1Xtra</div><div class="head">Radio 2</div><div class="head">6 Music</div>
<div id="times" class="timecol"></div><div id="lane-bbc_radio_one" class="lane"></div><div id="lane-bbc_1xtra" class="lane"></div><div id="lane-bbc_radio_two" class="lane"></div><div id="lane-bbc_6music" class="lane"></div>
</div></div><div id="diag" class="diag"></div></div>
<script>
const STATIONS=[{"id": "bbc_radio_one", "name": "Radio 1", "epg": "486874", "accent": "#ff6b8a", "listen": "https://www.bbc.co.uk/sounds/play/live/bbc_radio_one"}, {"id": "bbc_1xtra", "name": "1Xtra", "epg": "486676", "accent": "#9b7af7", "listen": "https://www.bbc.co.uk/sounds/play/live/bbc_1xtra"}, {"id": "bbc_radio_two", "name": "Radio 2", "epg": "486872", "accent": "#56c98a", "listen": "https://www.bbc.co.uk/sounds/play/live/bbc_radio_two"}, {"id": "bbc_6music", "name": "6 Music", "epg": "486708", "accent": "#f1ad4f", "listen": "https://www.bbc.co.uk/sounds/play/live/bbc_6music"}];const $=x=>document.getElementById(x),D=$("date"),board=$("board");let state={s:{},t:{},src:{}};
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()),today=()=>ymd(new Date());
const add=(s,n)=>{let d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return ymd(d)};
const fmt=d=>new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Accra",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function txt(url){let c=new AbortController(),tm=setTimeout(()=>c.abort(),12000);try{let r=await fetch(url,{cache:"no-store",signal:c.signal});if(!r.ok)throw Error("HTTP "+r.status);return await r.text()}finally{clearTimeout(tm)}}
function loose(s){s=s.trim();try{return JSON.parse(s)}catch(e){}let a=s.indexOf("{"),b=s.lastIndexOf("}");if(a>=0&&b>a)return JSON.parse(s.slice(a,b+1));throw Error("Parse")}
async function epg(st,date){let q=date.replaceAll("-",""),u=`https://epg.pw/api/epg.json?channel_id=${st.epg}&date=${q}&timezone=UTC`,tries=[u,`https://r.jina.ai/http://epg.pw/api/epg.json?channel_id=${st.epg}&date=${q}&timezone=UTC`];for(let i=0;i<tries.length;i++){try{let j=loose(await txt(tries[i]));if(Array.isArray(j.epg_list)&&j.epg_list.length)return{j,src:i?"relay":"direct"}}catch(e){}}throw Error("No EPG")}
function parseEPG(j,date){let r=(j.epg_list||[]).map(x=>({s:new Date(x.start_date),title:x.title||"Untitled"})).sort((a,b)=>a.s-b.s),ds=new Date(date+"T00:00:00Z"),de=new Date(ds.getTime()+86400000),out=[];for(let i=0;i<r.length;i++){let s=r[i].s,e=i+1<r.length?r[i+1].s:de;if(s<de&&e>ds)out.push({s:s<ds?ds:s,e:e>de?de:e,title:r[i].title})}return out}
async function track(st){let u=`https://rms.api.bbc.co.uk/v2/services/${st.id}/segments/latest?experience=domestic&offset=0&limit=4`,tries=[u,`https://r.jina.ai/http://rms.api.bbc.co.uk/v2/services/${st.id}/segments/latest?experience=domestic&offset=0&limit=4`];for(let i=0;i<tries.length;i++){try{let j=loose(await txt(tries[i])),a=Array.isArray(j.data)?j.data:[],x=a.find(v=>v.offset?.now_playing)||a[0];if(x)return{song:x.titles?.secondary||"Unknown track",artist:x.titles?.primary||"Unknown artist",src:i?"relay":"direct"}}catch(e){}}return null}
function drawTimes(){for(let h=0;h<24;h++){let d=document.createElement("div");d.className="hour";d.textContent=pad(h)+":00";$("times").appendChild(d)}}
function draw(st,a,date){let lane=$("lane-"+st.id);lane.innerHTML="";let ds=new Date(date+"T00:00:00Z"),n=new Date();for(const e of a){let top=(e.s-ds)/60000,dur=(e.e-e.s)/60000,d=document.createElement("div");d.className="event"+(date===today()&&n>=e.s&&n<e.e?" current":"");d.style.top=top+"px";d.style.height=Math.max(18,dur)+"px";d.style.setProperty("--accent",st.accent);d.innerHTML=`<div class="et">${fmt(e.s)}–${fmt(e.e)}</div><div class="en">${esc(e.title)}</div>`;lane.appendChild(d)}}
function current(a){let n=new Date();return(a||[]).find(x=>n>=x.s&&n<x.e)||null}
function next(a,c){if(!c)return null;let i=a.indexOf(c);return i>=0&&i<a.length-1?a[i+1]:null}
function cards(date){$("cards").innerHTML="";for(const st of STATIONS){let a=state.s[st.id]||[],c=current(a),n=next(a,c),tr=state.t[st.id],d=document.createElement("div");d.className="card";d.style.setProperty("--accent",st.accent);d.innerHTML=`<div class="toprow"><div class="name">${st.name}</div><div class="pill">${date===today()?"Live":"Guide"}</div></div><div class="kicker">Now</div><div class="prog">${esc(c?c.title:(a[0]?.title||"Schedule unavailable"))}</div><div class="meta">${c?fmt(c.s)+"–"+fmt(c.e):""}</div>${n?`<div class="kicker">Next</div><div class="meta">${fmt(n.s)} · ${esc(n.title)}</div>`:""}<div class="track"><div class="kicker">Track</div><div class="song">♪ ${esc(tr?tr.song:"No track metadata")}</div><div class="artist">${esc(tr?tr.artist:"")}</div></div><a class="listen" href="${st.listen}" target="_blank">Listen live ↗</a>`;$("cards").appendChild(d)}}
function nowline(date){board.querySelectorAll(".nowline,.nowtag").forEach(x=>x.remove());if(date!==today())return;let p=new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Accra",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()),m=Number(p.find(x=>x.type==="hour").value)*60+Number(p.find(x=>x.type==="minute").value),l=document.createElement("div");l.className="nowline";l.style.top=54+m+"px";board.appendChild(l);let t=document.createElement("div");t.className="nowtag";t.style.top=54+m+"px";t.textContent="NOW "+pad(Math.floor(m/60))+":"+pad(m%60);board.appendChild(t)}
async function loadSchedules(){let date=D.value||today();await Promise.all(STATIONS.map(async st=>{try{let r=await epg(st,date);state.s[st.id]=parseEPG(r.j,date);state.src[st.id]={...(state.src[st.id]||{}),s:r.src}}catch(e){state.s[st.id]=[];state.src[st.id]={...(state.src[st.id]||{}),s:"unavailable"}};draw(st,state.s[st.id],date)}));cards(date);nowline(date);$("status").textContent="Schedules updated";diag()}
async function loadTracks(){await Promise.all(STATIONS.map(async st=>{let tr=await track(st);if(tr){state.t[st.id]=tr;state.src[st.id]={...(state.src[st.id]||{}),t:tr.src}}}));cards(D.value||today());diag()}
function diag(){$("updated").textContent="Updated "+new Date().toLocaleTimeString("en-GB",{timeZone:"Africa/Accra"})+" GMT";$("diag").textContent=STATIONS.map(st=>`${st.name}: ${state.src[st.id]?.s||"no schedule"} / ${state.src[st.id]?.t||"no track"}`).join(" · ")}
async function refresh(){$("status").textContent="Refreshing…";await loadSchedules();await loadTracks()}
$("prev").onclick=()=>{D.value=add(D.value,-1);loadSchedules()};$("next").onclick=()=>{D.value=add(D.value,1);loadSchedules()};$("today").onclick=()=>{D.value=today();refresh()};$("refresh").onclick=refresh;D.onchange=loadSchedules;
drawTimes();D.value=today();refresh();setInterval(()=>{if(!document.hidden)loadTracks()},60000);setInterval(()=>{if(!document.hidden)loadSchedules()},600000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("service-worker.js").catch(()=>{});
</script></body></html>
